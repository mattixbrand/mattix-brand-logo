<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTM Test - Mattix</title>
    
    <!-- Google Tag Manager -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-K6XSVJXN');</script>

<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-K6XSVJXN"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    
    <h1>GTM Debug Test</h1>
    <p>Testing GTM implementation...</p>
    
    <script>
        // Debug GTM loading
        console.log('GTM Debug Test Started');
        console.log('dataLayer exists:', typeof window.dataLayer !== 'undefined');
        console.log('dataLayer content:', window.dataLayer);
        
        // Test custom event
        setTimeout(() => {
            if (window.dataLayer) {
                window.dataLayer.push({
                    'event': 'test_event',
                    'test_parameter': 'debug_value'
                });
                console.log('Test event pushed to dataLayer');
            }
        }, 2000);
        
        // Check if GTM script loaded
        setTimeout(() => {
            const gtmScript = document.querySelector('script[src*="googletagmanager.com"]');
            console.log('GTM script found:', !!gtmScript);
            if (gtmScript) {
                console.log('GTM script src:', gtmScript.src);
            }
        }, 1000);
    </script>
</body>
</html>
